<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EcoCash — Loan Application</title>
  <meta name="description" content="Complete your EcoCash loan application.">

  <style>
   * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  width: 100%;
  min-height: 100%;
}

body {
  width: 100%;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f9fc;
  color: #18233d;
}

/* =========================
   PAGE
========================= */

.page {
  width: min(100%, 1100px);
  min-height: 100vh;
  margin: 0 auto;

  background: #ffffff;

  border: 1px solid #e4e8ee;
  border-radius: 24px;

  overflow: hidden;

  box-shadow:
    0 4px 25px rgba(20, 33, 61, 0.06);
}

/* =========================
   HEADER
========================= */

.header {
  position: relative;

  height: 125px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #ffffff;

  border-bottom: 3px solid #1761c4;
}

.back-button {
  position: absolute;

  left: 30px;
  top: 50%;

  transform: translateY(-50%);

  width: 46px;
  height: 46px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 50%;

  background: #f2f6fb;

  color: #17233c;

  font-size: 34px;
  font-weight: 300;

  line-height: 1;

  cursor: pointer;
}

.logo {
  font-size: 58px;
  font-weight: 800;

  letter-spacing: -4px;
}

.logo-blue {
  color: #1761c4;
}

.logo-red {
  color: #df3028;
}

/* =========================
   CONTENT
========================= */

.content {
  width: min(680px, calc(100% - 40px));

  margin: 0 auto;

  padding: 32px 0 55px;
}

/* =========================
   PROGRESS
========================= */

.step-container {
  margin-bottom: 28px;
}

.step-row {
  display: flex;

  justify-content: space-between;
  align-items: center;

  margin-bottom: 9px;
}

.step-label {
  color: #63718a;

  font-size: 14px;
  font-weight: 600;
}

.step-number {
  color: #1761c4;
  font-weight: 700;
}

.progress {
  width: 100%;
  height: 6px;

  border-radius: 20px;

  background: #e8edf4;

  overflow: hidden;
}

.progress-bar {
  width: 33.33%;
  height: 100%;

  border-radius: 20px;

  background: #1761c4;
}

/* =========================
   TITLE
========================= */

h1 {
  color: #111d35;

  font-size: 42px;
  line-height: 1.15;

  font-weight: 600;

  margin-bottom: 12px;
}

.subtitle {
  color: #59677f;

  font-size: 18px;
  line-height: 1.5;

  margin-bottom: 28px;
}

/* =========================
   FORM CARD
========================= */

.form-card {
  width: 100%;

  padding: 26px;

  border-radius: 18px;

  background: #ffffff;

  border: 1px solid #e1e6ee;

  box-shadow:
    0 6px 22px rgba(23, 97, 196, 0.06);
}

/* =========================
   FIELD
========================= */

.field {
  margin-bottom: 22px;
}

.field:last-of-type {
  margin-bottom: 0;
}

.field-label {
  display: block;

  margin-bottom: 8px;

  color: #303c57;

  font-size: 16px;
  font-weight: 700;
}

select,
input[type="number"],
textarea {
  width: 100%;

  border: 1.5px solid #cbd3df;
  border-radius: 12px;

  padding: 0 15px;

  background: #ffffff;

  color: #17233c;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;

  outline: none;

  transition: border-color .15s ease,
              box-shadow .15s ease;
}

select,
input[type="number"] {
  height: 56px;
}

textarea {
  min-height: 115px;

  padding-top: 14px;
  padding-bottom: 14px;

  resize: vertical;

  line-height: 1.5;
}

select {
  appearance: none;
  -webkit-appearance: none;

  cursor: pointer;

  padding-right: 42px;

  background-image:
    linear-gradient(45deg, transparent 50%, #687386 50%),
    linear-gradient(135deg, #687386 50%, transparent 50%);

  background-position:
    calc(100% - 19px) 23px,
    calc(100% - 13px) 23px;

  background-size:
    6px 6px,
    6px 6px;

  background-repeat: no-repeat;
}

select:focus,
input[type="number"]:focus,
textarea:focus {
  border-color: #1761c4;

  box-shadow:
    0 0 0 3px rgba(23, 97, 196, 0.10);
}

input::placeholder,
textarea::placeholder {
  color: #9aa4b2;
}

/* =========================
   AMOUNT
========================= */

.amount-wrapper {
  position: relative;
}

.currency {
  position: absolute;

  left: 16px;
  top: 50%;

  transform: translateY(-50%);

  color: #59677f;

  font-size: 16px;
  font-weight: 700;

  pointer-events: none;
}

.amount-input {
  padding-left: 38px !important;

  font-weight: 600;
}

/* =========================
   LOAN SUMMARY
========================= */

.loan-summary {
  margin-top: 24px;

  padding: 18px;

  border-radius: 14px;

  background: #f3f7fd;

  border: 1px solid #dce7f6;
}

.summary-title {
  margin-bottom: 12px;

  color: #172c4a;

  font-size: 17px;
  font-weight: 700;
}

.summary-row {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 15px;

  padding: 9px 0;

  border-bottom: 1px solid #dce5f1;
}

.summary-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.summary-label {
  color: #6a778c;

  font-size: 14px;
}

.summary-value {
  color: #172c4a;

  font-size: 15px;
  font-weight: 700;

  text-align: right;
}

/* =========================
   ERROR
========================= */

.error-message {
  display: none;

  margin-top: 16px;

  padding: 12px 15px;

  border-radius: 10px;

  background: #fff1f1;

  color: #c5221f;

  font-size: 14px;
  font-weight: 600;

  text-align: center;
}

.error-message.show {
  display: block;
}

/* =========================
   NEXT BUTTON
========================= */

.next-button {
  width: 100%;
  height: 60px;

  margin-top: 25px;

  border: none;
  border-radius: 12px;

  background: #1761c4;

  color: #ffffff;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;

  box-shadow:
    0 6px 16px rgba(23, 97, 196, 0.18);

  transition: .2s ease;
}

.next-button:hover {
  background: #0f55b1;
}

.next-button:active {
  transform: scale(.985);
}

/* =========================
   BACK LINK
========================= */

.back-link {
  display: block;

  width: 100%;

  margin-top: 12px;

  padding: 11px;

  border: none;

  background: transparent;

  color: #63718a;

  font-family: Arial, Helvetica, sans-serif;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  text-align: center;
}

.back-link:hover {
  color: #1761c4;
}

/* =========================
   SECURITY
========================= */

.security {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 9px;

  margin-top: 25px;

  color: #66748a;

  font-size: 13px;

  text-align: center;
}

.security-icon {
  width: 30px;
  height: 30px;

  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 8px;

  background: #edf5ff;

  font-size: 15px;
}

/* =========================
   FOOTER
========================= */

.secure-footer {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  margin-top: 40px;

  color: #718096;

  font-size: 12px;

  text-align: center;
}

.lock {
  font-size: 16px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  body {
    background: #ffffff;
  }

  .page {
    width: 100%;
    min-height: 100vh;

    margin: 0;

    border: none;
    border-radius: 0;

    box-shadow: none;
  }

  .header {
    height: 78px;

    border-bottom: 2px solid #1761c4;
  }

  .back-button {
    left: 14px;

    width: 38px;
    height: 38px;

    font-size: 29px;
  }

  .logo {
    font-size: 37px;
    letter-spacing: -2.5px;
  }

  .content {
    width: calc(100% - 28px);

    padding: 24px 0 35px;
  }

  .step-container {
    margin-bottom: 23px;
  }

  .step-label {
    font-size: 12px;
  }

  .progress {
    height: 5px;
  }

  h1 {
    font-size: 31px;
    line-height: 1.18;

    margin-bottom: 9px;
  }

  .subtitle {
    font-size: 15px;
    line-height: 1.45;

    margin-bottom: 22px;
  }

  .form-card {
    padding: 20px 16px;

    border-radius: 15px;
  }

  .field {
    margin-bottom: 19px;
  }

  .field-label {
    margin-bottom: 7px;

    font-size: 14px;
  }

  select,
  input[type="number"] {
    height: 52px;

    padding-left: 13px;
    padding-right: 13px;

    border-radius: 10px;

    font-size: 15px;
  }

  select {
    padding-right: 38px;

    background-position:
      calc(100% - 17px) 21px,
      calc(100% - 11px) 21px;
  }

  textarea {
    min-height: 100px;

    padding: 13px;

    border-radius: 10px;

    font-size: 15px;
  }

  .currency {
    left: 14px;

    font-size: 15px;
  }

  .amount-input {
    padding-left: 35px !important;
  }

  .loan-summary {
    margin-top: 20px;

    padding: 15px;

    border-radius: 12px;
  }

  .summary-title {
    margin-bottom: 9px;

    font-size: 15px;
  }

  .summary-row {
    padding: 7px 0;

    gap: 10px;
  }

  .summary-label {
    font-size: 13px;
  }

  .summary-value {
    font-size: 14px;
  }

  .error-message {
    font-size: 13px;
  }

  .next-button {
    height: 56px;

    margin-top: 21px;

    border-radius: 11px;

    font-size: 16px;
  }

  .back-link {
    margin-top: 9px;

    font-size: 13px;
  }

  .security {
    margin-top: 20px;

    font-size: 12px;
  }

  .security-icon {
    width: 27px;
    height: 27px;

    font-size: 13px;
  }

  .secure-footer {
    margin-top: 30px;

    font-size: 11px;
  }

  .lock {
    font-size: 14px;
  }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

  .content {
    width: calc(100% - 22px);

    padding-top: 20px;
  }

  .header {
    height: 72px;
  }

  .back-button {
    left: 10px;

    width: 34px;
    height: 34px;
  }

  .logo {
    font-size: 34px;
  }

  h1 {
    font-size: 28px;
  }

  .subtitle {
    font-size: 14px;
  }

  .form-card {
    padding: 17px 13px;
  }

  .field-label {
    font-size: 13px;
  }

  select,
  input[type="number"] {
    height: 49px;

    font-size: 14px;
  }

  textarea {
    min-height: 90px;

    font-size: 14px;
  }

  .loan-summary {
    padding: 13px;
  }

  .next-button {
    height: 53px;

    font-size: 15px;
  }
}
  </style>
</head>

<body>

  

  <main class="page">

    <!-- HEADER -->

    <header class="header">

      <button
        type="button"
        class="back-button"
        id="backButton"
        aria-label="Go back"
      >
        ‹
      </button>

      <div class="logo">
        <span class="logo-blue">Eco</span><span class="logo-red">Cash</span>
      </div>

    </header>


    <!-- CONTENT -->

    <section class="content">

      <!-- PROGRESS -->

      <div class="step-container">

        <div class="step-row">

          <span class="step-label">
            Loan Application
          </span>

          <span class="step-label">
            Step <span class="step-number">1</span> of 3
          </span>

        </div>

        <div class="progress">

          <div class="progress-bar"></div>

        </div>

      </div>


      <!-- TITLE -->

      <h1>
        Tell us about your loan
      </h1>

      <p class="subtitle">
        Choose your loan type and provide a few details
        to continue your application.
      </p>


      <!-- FORM -->

      <form
        class="form-card"
        id="loanForm"
      >

        <!-- LOAN TYPE -->

        <div class="field">

          <label
            class="field-label"
            for="loanType"
          >
            Loan Type
          </label>

          <select
            id="loanType"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              Select loan type
            </option>

            <option value="personal">
              Personal Loan
            </option>

            <option value="business">
              Business Loan
            </option>

            <option value="home">
              Home Loan
            </option>

            <option value="car">
              Car Loan
            </option>

            <option value="education">
              Education Loan
            </option>

          </select>

        </div>


        <!-- LOAN AMOUNT -->

        <div class="field">

          <label
            class="field-label"
            for="loanAmount"
          >
            Loan Amount
          </label>

          <div class="amount-wrapper">

            <span class="currency">
              $
            </span>

            <input
              class="amount-input"
              type="number"
              id="loanAmount"
              min="100"
              max="5000"
              step="100"
              placeholder="Enter amount"
              required
            >

          </div>

        </div>


        <!-- LOAN TERM -->

        <div class="field">

          <label
            class="field-label"
            for="loanTerm"
          >
            Loan Term
          </label>

          <select
            id="loanTerm"
            required
          >

            <option
              value=""
              selected
              disabled
            >
              Select loan term
            </option>

            <option value="6">
              6 Months
            </option>

            <option value="12">
              12 Months
            </option>

            <option value="18">
              18 Months
            </option>

            <option value="24">
              24 Months
            </option>

            <option value="36">
              36 Months
            </option>

            <option value="48">
              48 Months
            </option>

            <option value="60">
              60 Months
            </option>

          </select>

        </div>


        <!-- PURPOSE -->

        <div class="field">

          <label
            class="field-label"
            for="purpose"
          >
            Purpose of Loan
          </label>

          <textarea
            id="purpose"
            placeholder="Briefly tell us what the loan will be used for"
            required
          ></textarea>

        </div>


        <!-- SAVED LOAN SUMMARY -->

        <div class="loan-summary">

          <div class="summary-title">
            Your Selected Loan
          </div>

          <div class="summary-row">

            <span class="summary-label">
              Amount
            </span>

            <span
              class="summary-value"
              id="summaryAmount"
            >
              —
            </span>

          </div>

          <div class="summary-row">

            <span class="summary-label">
              Term
            </span>

            <span
              class="summary-value"
              id="summaryTerm"
            >
              —
            </span>

          </div>

        </div>


        <!-- ERROR -->

        <div
          class="error-message"
          id="errorMessage"
        >
          Please complete all required fields.
        </div>


        <!-- NEXT -->

        <button
          type="submit"
          class="next-button"
        >
          NEXT STEP
        </button>


        <!-- BACK -->

        <button
          type="button"
          class="back-link"
          id="backButtonBottom"
        >
          ← Back to Loan Calculator
        </button>

      </form>


      <!-- SECURITY -->

      <div class="security">

        <div class="security-icon">
          🔒
        </div>

        <span>
          Your application information is protected.
        </span>

      </div>


      <!-- FOOTER -->

      <div class="secure-footer">

        <span class="lock">
          ♙
        </span>

        <span>
          © 2026 EcoCash. All rights reserved.
        </span>

      </div>

    </section>

  </main>


  <script>

    /* ==========================================================
       ELEMENTS
    ========================================================== */

    const loanForm =
      document.getElementById("loanForm");

    const loanType =
      document.getElementById("loanType");

    const loanAmount =
      document.getElementById("loanAmount");

    const loanTerm =
      document.getElementById("loanTerm");

    const purpose =
      document.getElementById("purpose");

    const summaryAmount =
      document.getElementById("summaryAmount");

    const summaryTerm =
      document.getElementById("summaryTerm");

    const errorMessage =
      document.getElementById("errorMessage");


    /* ==========================================================
       LOAD SAVED DATA FROM index.html
    ========================================================== */

    const savedAmount =
      sessionStorage.getItem("loanAmount");

    const savedTerm =
      sessionStorage.getItem("loanTerm");

    if (savedAmount) {

      loanAmount.value =
        savedAmount;

    }

    if (savedTerm) {

      loanTerm.value =
        savedTerm;

    }


    /* ==========================================================
       FORMAT SAVED DATA
    ========================================================== */

    function updateSummary() {

      const amount =
        Number(loanAmount.value);

      const term =
        Number(loanTerm.value);


      if (amount) {

        summaryAmount.textContent =
          "$" + amount.toLocaleString("en-US");

      } else {

        summaryAmount.textContent =
          "—";

      }


      if (term) {

        summaryTerm.textContent =
          term + " Months";

      } else {

        summaryTerm.textContent =
          "—";

      }

    }


    /* ==========================================================
       UPDATE SUMMARY WHEN VALUES CHANGE
    ========================================================== */

    loanAmount.addEventListener(
      "input",
      updateSummary
    );

    loanTerm.addEventListener(
      "change",
      updateSummary
    );


    /* ==========================================================
       SAVE APPLICATION
    ========================================================== */

    loanForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        errorMessage.classList.remove("show");


        if (!loanForm.checkValidity()) {

          loanForm.reportValidity();

          errorMessage.textContent =
            "Please complete all required fields.";

          errorMessage.classList.add("show");

          return;

        }


        const amount =
          Number(loanAmount.value);

        const term =
          Number(loanTerm.value);


        /* Validate amount */

        if (
          amount < 100 ||
          amount > 5000
        ) {

          errorMessage.textContent =
            "Please enter an amount between $100 and $5,000.";

          errorMessage.classList.add("show");

          loanAmount.focus();

          return;

        }


        /* Save values */

        sessionStorage.setItem(
          "loanType",
          loanType.value
        );

        sessionStorage.setItem(
          "loanAmount",
          String(amount)
        );

        sessionStorage.setItem(
          "loanTerm",
          String(term)
        );

        sessionStorage.setItem(
          "loanPurpose",
          purpose.value.trim()
        );


        /*
          Continue to the next application step.
        */

        window.location.href =
          "application.html";

      }
    );


    /* ==========================================================
       BACK BUTTONS
    ========================================================== */

    function goBack() {

      window.location.href =
        "index.html";

    }


    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        goBack
      );


    document
      .getElementById("backButtonBottom")
      .addEventListener(
        "click",
        goBack
      );


    /* ==========================================================
       INITIAL STATE
    ========================================================== */

    updateSummary();

  </script>

</body>
</html>
